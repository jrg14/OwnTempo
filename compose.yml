name: owntempo

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-owntempo}
      POSTGRES_USER: ${POSTGRES_USER:-owntempo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owntempo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend:Z
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python scripts/wait_for_db.py &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  report-worker:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-true}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:3b-instruct}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-180}
    volumes:
      - ./backend:/app/backend:Z
    networks:
      - default
      - ai_internal
    depends_on:
      backend:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: >-
      sh -c "python scripts/wait_for_db.py &&
      python manage.py process_monthly_reports --watch"

  ollama:
    profiles: ["ai"]
    image: docker.io/ollama/ollama:0.40.17
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_internal
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  ollama_data:

networks:
  ai_internal:


