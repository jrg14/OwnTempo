<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OwnTempo · Propuesta de menú</title>
    <style>
      :root {
        color: #18302b;
        background: #e5ece9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; }
      button { font: inherit; }
      button:focus-visible { outline: 3px solid #e6a75a; outline-offset: 3px; }
      ::selection { color: #fff; background: #1f6b5c; }

      .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

      .app-preview {
        min-height: 100vh;
        padding: 22px clamp(20px, 5vw, 72px);
        color: #18302b;
        background: #f4f7f6;
      }

      .app-bar { display: flex; align-items: center; gap: 10px; }
      .mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: #1f6b5c; }
      .mark::after { width: 10px; height: 10px; border-radius: 50%; background: #e6a75a; content: ""; }
      .brand { font-size: 1.2rem; font-weight: 850; letter-spacing: -0.025em; }
      .app-bar__ghost { margin-left: auto; width: 118px; height: 38px; border-radius: 11px; background: #e4ece9; }

      .preview-content { width: min(760px, 74vw); margin-top: 72px; }
      .preview-content h1 { max-width: 12ch; margin: 0; font-size: clamp(2.5rem, 6vw, 5.75rem); line-height: 0.96; letter-spacing: -0.04em; }
      .preview-content p { width: min(54ch, 80%); margin: 24px 0 0; color: #60736e; line-height: 1.65; }
      .preview-lines { margin-top: 44px; display: grid; gap: 14px; }
      .preview-lines span { height: 18px; border-radius: 6px; background: #e4ece9; }
      .preview-lines span:nth-child(1) { width: 86%; }
      .preview-lines span:nth-child(2) { width: 64%; }
      .preview-lines span:nth-child(3) { width: 72%; }

      .scrim { position: fixed; inset: 0; background: rgb(11 31 27 / 52%); }

      .menu {
        position: fixed;
        z-index: 2;
        inset: 0 0 0 auto;
        width: min(100%, 408px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
        background: #f7f9f8;
        box-shadow: -24px 0 64px rgb(10 38 32 / 25%);
      }

      .menu__header { padding: 18px 18px 16px; border-bottom: 1px solid #dce7e3; background: #fff; }
      .menu__topline { display: flex; align-items: center; gap: 12px; }
      .menu__title { min-width: 0; flex: 1; }
      .menu__title strong, .menu__title span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .menu__title strong { font-size: 1rem; }
      .menu__title span { margin-top: 2px; color: #60736e; font-size: 0.78rem; }
      .avatar { width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 44px; border-radius: 50%; color: #fff; background: #1f6b5c; font-size: 0.92rem; font-weight: 850; }
      .icon-button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; color: #1f6b5c; background: #e9f2ef; cursor: pointer; }
      .icon-button:hover { background: #dcebe6; }

      .space-switcher { position: relative; margin-top: 16px; }
      .space-switcher__button {
        width: 100%; min-height: 64px; padding: 10px 12px;
        display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 10px;
        border: 1px solid #cddbd6; border-radius: 14px; color: #18302b; background: #f8fbfa; text-align: left; cursor: pointer;
      }
      .space-switcher__button:hover { border-color: #7fa99e; background: #f0f6f4; }
      .space-switcher__icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; color: #fff; background: #1f6b5c; }
      .space-switcher__icon .icon { width: 18px; height: 18px; }
      .space-switcher__copy strong, .space-switcher__copy span { display: block; }
      .space-switcher__copy strong { font-size: 0.9rem; }
      .space-switcher__copy span { margin-top: 2px; color: #60736e; font-size: 0.73rem; }
      .space-switcher__button > .icon { width: 18px; height: 18px; color: #60736e; transition: transform 180ms cubic-bezier(.16, 1, .3, 1); }
      .space-switcher.is-open .space-switcher__button > .icon { transform: rotate(180deg); }
      .space-switcher__options {
        position: absolute; z-index: 4; top: calc(100% + 6px); right: 0; left: 0; margin: 0; padding: 6px;
        display: none; list-style: none; border: 1px solid #cddbd6; border-radius: 14px; background: #fff; box-shadow: 0 16px 34px rgb(18 60 50 / 16%);
      }
      .space-switcher.is-open .space-switcher__options { display: grid; }
      .space-switcher__options button { width: 100%; min-height: 48px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 10px; color: #35584f; background: transparent; text-align: left; cursor: pointer; }
      .space-switcher__options button:hover { background: #edf4f1; }
      .space-switcher__options button[aria-current="true"] { color: #174f45; background: #e4f0ec; font-weight: 800; }

      .menu__scroll { min-height: 0; padding: 20px 18px 24px; overflow-y: auto; scrollbar-color: #a9bdb7 transparent; scrollbar-width: thin; }
      .section-heading { margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
      .section-heading h2 { margin: 0; font-size: 0.82rem; letter-spacing: 0.015em; }
      .section-heading span { color: #70827d; font-size: 0.72rem; }

      .modules { display: grid; gap: 4px; }
      .module {
        width: 100%; min-height: 56px; padding: 8px 10px;
        display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 11px;
        border: 0; border-radius: 12px; color: #284c44; background: transparent; text-align: left; cursor: pointer;
      }
      .module:hover { background: #eaf2ef; }
      .module[aria-current="page"] { color: #fff; background: #1f6b5c; }
      .module__icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; color: #1f6b5c; background: #e4f0ec; }
      .module[aria-current="page"] .module__icon { color: #fff; background: rgb(255 255 255 / 15%); }
      .module__copy strong, .module__copy span { display: block; }
      .module__copy strong { font-size: 0.86rem; }
      .module__copy span { margin-top: 2px; color: #6c7e79; font-size: 0.72rem; }
      .module[aria-current="page"] .module__copy span { color: #d9e9e4; }
      .module > .icon { width: 17px; height: 17px; color: #8aa098; }
      .module[aria-current="page"] > .icon { color: #fff; }

      .settings { margin-top: 24px; padding-top: 20px; border-top: 1px solid #dce7e3; }
      .settings__list { display: grid; gap: 2px; }
      .settings__item { width: 100%; min-height: 52px; padding: 7px 8px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; border: 0; border-radius: 11px; color: #35584f; background: transparent; text-align: left; cursor: pointer; }
      .settings__item:hover { background: #eaf2ef; }
      .settings__item > .icon:first-child { width: 19px; height: 19px; color: #1f6b5c; }
      .settings__item > .icon:last-child { width: 16px; height: 16px; color: #8aa098; }
      .settings__item strong { font-size: 0.82rem; }

      .menu__footer { padding: 12px 18px max(14px, env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #dce7e3; background: #fff; }
      .account-link, .logout { min-height: 44px; border: 0; border-radius: 11px; cursor: pointer; }
      .account-link { padding: 0 12px; display: flex; align-items: center; gap: 8px; color: #35584f; background: #edf3f1; font-size: 0.78rem; font-weight: 800; }
      .logout { width: 44px; display: grid; place-items: center; color: #9b403d; background: #fbeceb; }
      .logout:hover { background: #f6deda; }

      .toast { position: fixed; z-index: 5; right: 428px; bottom: 24px; padding: 12px 14px; border-radius: 12px; color: #fff; background: #173f37; box-shadow: 0 12px 28px rgb(10 38 32 / 24%); font-size: 0.82rem; font-weight: 750; opacity: 0; transform: translateY(8px); pointer-events: none; transition: 180ms cubic-bezier(.16, 1, .3, 1); }
      .toast.is-visible { opacity: 1; transform: translateY(0); }

      @media (max-width: 620px) {
        .app-preview { display: none; }
        .scrim { display: none; }
        .menu { width: 100%; }
        .toast { right: 18px; bottom: 76px; left: 18px; text-align: center; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <svg aria-hidden="true" width="0" height="0" style="position:absolute">
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7" /><path d="M6 10v10h12V10M9 20v-6h6v6" /></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4.5 21a7.5 7.5 0 0 1 15 0" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z" /><path d="M9 8a3 3 0 0 1 6 0" /></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 5.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" /></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6h14a2 2 0 0 1 2 2v11H6a2 2 0 0 1-2-2V6Z" /><path d="M4 8V5a2 2 0 0 1 2-2h11v5M15 13h5" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" /><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 4 5" /></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.8 9a2.3 2.3 0 1 1 3.8 1.8c-1 .7-1.6 1.2-1.6 2.7M12 17h.01" /></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10" /></symbol>
    </svg>

    <main class="app-preview" aria-hidden="true">
      <header class="app-bar"><span class="mark"></span><span class="brand">OwnTempo</span><span class="app-bar__ghost"></span></header>
      <section class="preview-content"><h1>Tu ritmo, en un solo lugar.</h1><p>Organiza tareas, compras y planes con las personas que comparten tu día a día.</p><div class="preview-lines"><span></span><span></span><span></span></div></section>
    </main>
    <div class="scrim" aria-hidden="true"></div>

    <aside class="menu" aria-labelledby="menu-title">
      <header class="menu__header">
        <div class="menu__topline">
          <span class="avatar">A</span>
          <div class="menu__title"><strong id="menu-title">Navegación</strong><span>Ana · @ana</span></div>
          <button class="icon-button" type="button" aria-label="Cerrar menú"><svg class="icon"><use href="#i-x" /></svg></button>
        </div>

        <div class="space-switcher" id="space-switcher">
          <button class="space-switcher__button" type="button" aria-expanded="false" aria-controls="space-options">
            <span class="space-switcher__icon"><svg class="icon"><use href="#i-home" /></svg></span>
            <span class="space-switcher__copy"><strong id="current-space">Casa</strong><span id="current-space-kind">Espacio compartido</span></span>
            <svg class="icon"><use href="#i-down" /></svg>
          </button>
          <ul class="space-switcher__options" id="space-options">
            <li><button type="button" data-space="Casa" data-kind="Espacio compartido" aria-current="true"><svg class="icon"><use href="#i-home" /></svg>Casa</button></li>
            <li><button type="button" data-space="Personal" data-kind="Solo para ti"><svg class="icon"><use href="#i-user" /></svg>Personal</button></li>
            <li><button type="button" data-space="Viaje" data-kind="Espacio compartido"><svg class="icon"><use href="#i-users" /></svg>Viaje</button></li>
          </ul>
        </div>
      </header>

      <div class="menu__scroll">
        <section aria-labelledby="modules-title">
          <div class="section-heading"><h2 id="modules-title">En Casa</h2><span>5 módulos</span></div>
          <nav class="modules" aria-label="Módulos del espacio actual">
            <button class="module" type="button" aria-current="page" data-module="Tareas"><span class="module__icon"><svg class="icon"><use href="#i-check" /></svg></span><span class="module__copy"><strong>Tareas</strong><span>3 pendientes</span></span><svg class="icon"><use href="#i-arrow" /></svg></button>
            <button class="module" type="button" data-module="Compras"><span class="module__icon"><svg class="icon"><use href="#i-bag" /></svg></span><span class="module__copy"><strong>Compras</strong><span>8 artículos</span></span><svg class="icon"><use href="#i-arrow" /></svg></button>
            <button class="module" type="button" data-module="Deseos"><span class="module__icon"><svg class="icon"><use href="#i-heart" /></svg></span><span class="module__copy"><strong>Deseos</strong><span>4 ideas guardadas</span></span><svg class="icon"><use href="#i-arrow" /></svg></button>
            <button class="module" type="button" data-module="Calendario"><span class="module__icon"><svg class="icon"><use href="#i-calendar" /></svg></span><span class="module__copy"><strong>Calendario</strong><span>2 eventos esta semana</span></span><svg class="icon"><use href="#i-arrow" /></svg></button>
            <button class="module" type="button" data-module="Gastos"><span class="module__icon"><svg class="icon"><use href="#i-wallet" /></svg></span><span class="module__copy"><strong>Gastos</strong><span>Resumen de noviembre</span></span><svg class="icon"><use href="#i-arrow" /></svg></button>
          </nav>
        </section>

        <section class="settings" aria-labelledby="settings-title">
          <div class="section-heading"><h2 id="settings-title">Organizar OwnTempo</h2></div>
          <div class="settings__list">
            <button class="settings__item" type="button"><svg class="icon"><use href="#i-grid" /></svg><strong>Configurar módulos</strong><svg class="icon"><use href="#i-arrow" /></svg></button>
            <button class="settings__item" type="button"><svg class="icon"><use href="#i-users" /></svg><strong>Gestionar espacios</strong><svg class="icon"><use href="#i-arrow" /></svg></button>
            <button class="settings__item" type="button"><svg class="icon"><use href="#i-help" /></svg><strong>Ayuda y diagnóstico</strong><svg class="icon"><use href="#i-arrow" /></svg></button>
          </div>
        </section>
      </div>

      <footer class="menu__footer">
        <button class="account-link" type="button"><svg class="icon"><use href="#i-user" /></svg>Cuenta y ajustes</button>
        <button class="logout" type="button" aria-label="Cerrar sesión"><svg class="icon"><use href="#i-logout" /></svg></button>
      </footer>
    </aside>
    <div class="toast" role="status" aria-live="polite"></div>

    <script>
      const switcher = document.querySelector('#space-switcher');
      const switchButton = switcher.querySelector('.space-switcher__button');
      const spaceTitle = document.querySelector('#current-space');
      const spaceKind = document.querySelector('#current-space-kind');
      const modulesTitle = document.querySelector('#modules-title');
      const toast = document.querySelector('.toast');
      let toastTimer;

      switchButton.addEventListener('click', () => {
        const open = switcher.classList.toggle('is-open');
        switchButton.setAttribute('aria-expanded', String(open));
      });

      switcher.querySelectorAll('[data-space]').forEach((button) => {
        button.addEventListener('click', () => {
          switcher.querySelectorAll('[data-space]').forEach((item) => item.removeAttribute('aria-current'));
          button.setAttribute('aria-current', 'true');
          spaceTitle.textContent = button.dataset.space;
          spaceKind.textContent = button.dataset.kind;
          modulesTitle.textContent = `En ${button.dataset.space}`;
          switcher.classList.remove('is-open');
          switchButton.setAttribute('aria-expanded', 'false');
          showToast(`Espacio cambiado a ${button.dataset.space}`);
        });
      });

      document.querySelectorAll('[data-module]').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('[data-module]').forEach((item) => item.removeAttribute('aria-current'));
          button.setAttribute('aria-current', 'page');
          showToast(`${button.dataset.module} abierto · el menú se cerraría`);
        });
      });

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('is-visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 2200);
      }
    </script>
  </body>
</html>
